            fill="none" stroke="#e3a157" stroke-width="3" stroke-linecap="round"/>
      <path d="M-72 25l7-3" stroke="#304942" stroke-width="3" stroke-linecap="round"/>
    </g>

    <path id="frame" d="M246 377 350 274 389 382 246 377M350 274 532 276 549 315 389 382
