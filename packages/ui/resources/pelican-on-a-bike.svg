<svg xmlns="http://www.w3.org/2000/svg" width="840" height="540" viewBox="0 0 840 540"
     role="img" aria-labelledby="title desc">
  <title id="title">鹈鹕骑自行车</title>
  <desc id="desc">一只系着橘红围巾的白鹈鹕骑着青绿色自行车，沿着金色海边小路前行。</desc>
  <style>
    .wheel, .crank, .leg, .foot, .road-marks { animation-duration: 1.44s; }
    .wheel, .crank, .leg, .foot, .road-marks {
      animation-timing-function: linear;
      animation-iteration-count: infinite;
    }
    .wheel { animation-name: roll; }
    .crank { animation-name: pedal; }
    .leg { animation-name: leg; }
    .foot { animation-name: foot; }
    .far { color: #c77846; }
    .far .leg, .far .foot { animation-delay: -.72s; }
    .near { color: #f7ab55; }
    .road-marks { animation-name: pass; }
    .rider { transform-origin: 350px 245px; animation: bob .72s ease-in-out infinite alternate; }
    .scarf { transform-origin: 422px 174px; animation: flutter .49s ease-in-out infinite alternate; }
    .eye { transform-box: fill-box; transform-origin: center; animation: blink 4.8s infinite; }
    .waves { animation: drift 6s ease-in-out infinite alternate; }

    @keyframes roll { to { transform: rotate(360deg); } }
    @keyframes pedal {
      from { transform: rotate(45deg); }
      to { transform: rotate(405deg); }
    }
    @keyframes leg {
      0%, 100% { d: path("M351 244 L402.3 297.6 Q407.7 303.2 407.9 310.7 L410.2 403.2"); }
      8.3333% { d: path("M351 244 L393.8 304.6 Q398.3 311 398.2 318.5 L396.8 411"); }
      16.6667% { d: path("M351 244 L392.3 305.7 Q396.6 312.2 395.4 319.6 L381.2 411"); }
      25% { d: path("M351 244 L396.3 302.8 Q401.1 308.9 398.6 316 L367.8 403.2"); }
      33.3333% { d: path("M351 244 L403.1 296.8 Q408.6 302.4 405 308.9 L360 389.8"); }
      41.6667% { d: path("M351 244 L411 287.7 Q417.3 292.3 413 298.4 L360 374.2"); }
      50% { d: path("M351 244 L418.1 275.6 Q425.2 278.9 420.9 285 L367.8 360.8"); }
      58.3333% { d: path("M351 244 L422.6 263.7 Q430.1 265.8 426.4 272.3 L381.2 353"); }
      66.6667% { d: path("M351 244 L423.9 257.8 Q431.6 259.3 429 266.3 L396.8 353"); }
      75% { d: path("M351 244 L423.2 261.1 Q430.8 262.9 429.2 270.3 L410.2 360.8"); }
      83.3333% { d: path("M351 244 L419.8 271.7 Q427.1 274.6 426.4 282.1 L418 374.2"); }
      91.6667% { d: path("M351 244 L412.6 285.4 Q419 289.8 419 297.3 L418 389.8"); }
    }
    @keyframes foot {
      0%, 100% { transform: translate(410.2px, 403.2px); }
      8.3333% { transform: translate(396.8px, 411.0px); }
      16.6667% { transform: translate(381.2px, 411.0px); }
      25% { transform: translate(367.8px, 403.2px); }
      33.3333% { transform: translate(360.0px, 389.8px); }
      41.6667% { transform: translate(360.0px, 374.2px); }
      50% { transform: translate(367.8px, 360.8px); }
      58.3333% { transform: translate(381.2px, 353.0px); }
      66.6667% { transform: translate(396.8px, 353.0px); }
      75% { transform: translate(410.2px, 360.8px); }
      83.3333% { transform: translate(418.0px, 374.2px); }
      91.6667% { transform: translate(418.0px, 389.8px); }
    }
    @keyframes pass { to { transform: translateX(-560px); } }
    @keyframes bob { to { transform: rotate(1.3deg); } }
    @keyframes flutter { to { transform: rotate(5deg) skewY(-3deg); } }
    @keyframes blink {
      0%, 44%, 49%, 100% { transform: scaleY(1); }
      46.5% { transform: scaleY(.12); }
    }
    @keyframes drift { to { transform: translateX(-32px); } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#f4d5ae"/>
      <stop offset="1" stop-color="#fbeacc"/>
    </linearGradient>
    <linearGradient id="water" x2="0" y2="1">
      <stop stop-color="#bad4c8"/>
      <stop offset="1" stop-color="#8cb8ad"/>
    </linearGradient>
    <linearGradient id="sand" x2="0" y2="1">
