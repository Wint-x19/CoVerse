      <stop offset="1" stop-color="#ead0a5"/>
    </linearGradient>
    <linearGradient id="feathers" x2=".18" y2="1">
      <stop stop-color="#fff8e7"/>
      <stop offset=".58" stop-color="#fff5df"/>
      <stop offset="1" stop-color="#ebdac0"/>
    </linearGradient>
    <linearGradient id="pouch" x2="0" y2="1">
      <stop stop-color="#ffcb79"/>
      <stop offset="1" stop-color="#ee9b59"/>
    </linearGradient>
    <pattern id="paper" width="17" height="19" patternUnits="userSpaceOnUse">
